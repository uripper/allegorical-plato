[project]
name = "allegorical-plato"
version = "0.1.0"
description = "Exploratory corpus analysis for recurring motifs and allegorical patterns in Plato"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "typer>=0.27.1",
]

[project.scripts]
allegorical-plato = "allegorical_plato.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegorical_plato"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
