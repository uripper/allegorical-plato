[project]
name = "allegorical-plato"
version = "0.1.0"
description = "Exploratory corpus analysis for recurring motifs and allegorical patterns in Plato"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.20",
    "pyarrow>=18.0",
    "scikit-learn>=1.6",
    "typer>=0.15",
]

[project.scripts]
allegorical-plato = "allegorical_plato.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/allegorical_plato"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

